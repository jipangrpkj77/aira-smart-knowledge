<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIRA Knowledge Admin</title><style>
body{font-family:system-ui,sans-serif;background:#0d1423;color:#f0f6ff;max-width:760px;margin:50px auto;padding:0 20px}h1{color:#8fc6ff}.panel{padding:23px;border-radius:16px;border:1px solid #354966;background:#172338}label{display:block;margin:16px 0 5px}input{padding:12px;width:calc(100% - 26px);border:1px solid #a9b7cf;border-radius:8px}button{background:#237dd9;color:#fff;border:none;padding:13px 20px;border-radius:8px;margin-top:15px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;word-break:break-word;background:#0a1322;padding:15px;border-radius:8px}small{color:#b9c7da}</style></head><body><h1>AIRA Smart Knowledge™ V3.0</h1><div class="panel"><p>Auto Sync setiap 30 minit. Klik <strong>Sync Now</strong> untuk kemas kini manual. Hanya akses pentadbir setempat.</p><h2>Status pangkalan pengetahuan</h2><pre id="status">Memuatkan…</pre><label for="token">Token pentadbir (lihat terminal PowerShell widget_server.py)</label><input id="token" type="password" autocomplete="off" placeholder="Masukkan token pentadbir"><button id="sync">Sync Now</button><pre id="result" role="status" aria-live="polite">Belum disegerakkan secara manual.</pre><small>Token tidak disimpan dalam browser. Sumber sulit dan data pendaftaran peserta tidak diimport.</small></div><script>
async function refresh(){try{const r=await fetch('/api/knowledge/status');const d=await r.json();document.querySelector('#status').textContent=JSON.stringify(d,null,2)}catch(e){document.querySelector('#status').textContent='Server tidak tersedia'}}
document.querySelector('#sync').onclick=async()=>{const b=document.querySelector('#sync');b.disabled=true;document.querySelector('#result').textContent='Sedang menyegerakkan…';try{const r=await fetch('/api/admin/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:document.querySelector('#token').value})});const d=await r.json();document.querySelector('#result').textContent=JSON.stringify(d,null,2);await refresh()}catch(e){document.querySelector('#result').textContent='Gagal menghubungi pelayan'}finally{b.disabled=false}};
refresh();</script></body></html>
